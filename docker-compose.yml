services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: [.env]
    environment:
      CORS_ORIGINS: http://localhost:8501
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./outbox:/app/outbox", "./logs:/app/logs"]
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file: [.env]
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
